name: the called gate, with a mask nobody reviewed (installed as ci.yml)
# Exactly what re-adding `|| true` to ci.yml's `yarn build` would look like:
# the workflow has no deploy job of its own, so before the gating set crossed
# the `workflow_call` boundary this file was never inspected at all.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: ruff check backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - run: yarn install --frozen-lockfile
      - run: yarn build || true
