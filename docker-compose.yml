# Kailash — Production Docker Compose
# Usage: docker compose up -d
#
# Profiles:
#   kailash-ai — the FULL stack end-to-end: core services (backend, mongo,
#     postgres, redis — always on) PLUS the profile-gated additions:
#     frontend (nginx SPA, :3000), the Company-segment ledger (:8110), and
#     the 9 platform/ML services (:8101-:8109). Start everything with:
#       docker compose --profile kailash-ai up -d --build
#     Profile services are inert for plain `docker compose up -d`, so prod
#     deploys are unchanged.

x-platform-service: &platform_service
  profiles: ["kailash-ai"]
  restart: unless-stopped
  networks:
    - kailash-network
  environment: &platform_env
    # `:?` aborts at config-parse time, before any container is created. An
    # empty default here was an auth bypass: require_internal_token compares an
    # empty expected token against an absent header and lets the caller through.
    PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:?PLATFORM_INTERNAL_TOKEN must be set}
    ENV: ${ENV:-dev}
    LOG_JSON: "true"
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend:
    profiles: ["kailash-ai"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kailash-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - kailash-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  document-ai:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: document-ai, PORT: "8101" }
    container_name: kailash-document-ai
    ports: ["127.0.0.1:8101:8101"]

  forecasting:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: forecasting, PORT: "8102" }
    container_name: kailash-forecasting
    ports: ["127.0.0.1:8102:8102"]

  anomaly:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: anomaly, PORT: "8103" }
    container_name: kailash-anomaly
    ports: ["127.0.0.1:8103:8103"]

  rag:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: rag, PORT: "8104" }
    container_name: kailash-rag
    ports: ["127.0.0.1:8104:8104"]

  vision-gateway:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: vision-gateway, PORT: "8105" }
    container_name: kailash-vision-gateway
    ports: ["127.0.0.1:8105:8105"]

  speech:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: speech, PORT: "8106" }
    container_name: kailash-speech
    ports: ["127.0.0.1:8106:8106"]

  model-registry:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: model-registry, PORT: "8107" }
    container_name: kailash-model-registry
    ports: ["127.0.0.1:8107:8107"]
    environment:
      <<: *platform_env
      MODEL_REGISTRY_DB: /data/kailash_model_registry.db
    volumes:
      - model_registry_data:/data

  knowledge-graph:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: knowledge-graph, PORT: "8108" }
    container_name: kailash-knowledge-graph
    ports: ["127.0.0.1:8108:8108"]

  automobile-llm:
    <<: *platform_service
    build:
      context: .
      dockerfile: backend/services/Dockerfile.service
      args: { SERVICE: automobile-llm, PORT: "8109" }
    container_name: kailash-automobile-llm
    ports: ["127.0.0.1:8109:8109"]

  company:
    profiles: ["kailash-ai"]
    build:
      context: .
      dockerfile: backend/services/company/Dockerfile
    container_name: kailash-company
    restart: unless-stopped
    ports:
      - "127.0.0.1:8110:8110"
    environment:
      - COMPANY_DB_URL=postgresql://kailash:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/kailash
      - COMPANY_SCAFFOLD_DIR=/srv/company-segment
      - ENV=${ENV:-dev}
      - PLATFORM_INTERNAL_TOKEN=${PLATFORM_INTERNAL_TOKEN:?PLATFORM_INTERNAL_TOKEN must be set}
      - LOG_JSON=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kailash-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8110/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kailash-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DATABASE_NAME=kailash
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - POSTGRES_URL=postgresql+asyncpg://kailash:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/kailash
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kailash-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  mongo:
    image: mongo:7
    container_name: kailash-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      # Fresh-volume bootstrap only: collections + indexes.
      - ./database/mongodb_init.js:/docker-entrypoint-initdb.d/10-init.js:ro
    networks:
      - kailash-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      # mongosh boots a full Node runtime; 10s is too tight on a loaded host.
      timeout: 20s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: kailash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kailash
      POSTGRES_USER: kailash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Fresh-volume bootstrap only: enables pgcrypto + uuid-ossp.
      - ./database/postgres_init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    networks:
      - kailash-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kailash"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: kailash-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - kailash-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kailash-network:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
  postgres_data:
  redis_data:
  model_registry_data:
