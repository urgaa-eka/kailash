repos:
  - repo: local
    hooks:
      - id: critical-path-confirm
        name: Deployment critical path confirmation
        # Staged filenames arrive as arguments; the gate matches them against
        # scripts/verify/repo_state.py's CRITICAL_PATHS (single source of
        # truth) and refuses without CONFIRM_CRITICAL_PATH=1 in the
        # environment. See scripts/verify/commit_gate.py for why a token and
        # not a prompt.
        entry: python -m scripts.verify.commit_gate
        language: system
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
