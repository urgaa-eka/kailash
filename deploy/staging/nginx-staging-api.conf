# Nginx reverse proxy for the STAGING backend (Option D: same VPS, second
# compose project). Place at: /etc/nginx/sites-available/kailash-staging-api
#
# Proxies ONLY to 127.0.0.1:9000 (the staging compose project's backend
# port). Until that stack is up this host answers 502 -- which is correct:
# verify-staging must never be able to green itself against the production
# backend on 8000. The rate-limit zones live in nginx-api.conf; this file
# deliberately defines none so it cannot be loaded standalone.

upstream kailash_staging_backend {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging-api.kailash-ai.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.kailash-ai.in;

    ssl_certificate     /etc/letsencrypt/live/staging-api.kailash-ai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.kailash-ai.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_STAGING:5m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # No HSTS: staging must be cheap to tear down and re-point.

    client_max_body_size 50M;

    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://kailash_staging_backend;
        include /etc/nginx/proxy_params;
    }

    access_log /var/log/nginx/kailash-staging-api.access.log;
    error_log  /var/log/nginx/kailash-staging-api.error.log warn;
}
