name: staging and production jobs share a credential secret name
# Correctly ordered and fully gated on purpose: the only defect here is the
# shared secret, so a finding is attributable to the isolation rule alone.
on:
  push:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - run: python -m scripts.verify.config_drift

  ci-gate:
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    needs: [preflight, ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          key: ${{ secrets.VULTR_SSH_KEY }}

  verify-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - run: python -m scripts.verify.deployment_check --env staging

  deploy:
    needs: [verify-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          key: ${{ secrets.VULTR_SSH_KEY }}

  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: python -m scripts.verify.deployment_check --env production
