    ports: !override
      - "127.0.0.1:9102:8102"
    environment:
      PLATFORM_INTERNAL_TOKEN: ${STAGING_PLATFORM_INTERNAL_TOKEN:?STAGING_PLATFORM_INTERNAL_TOKEN must be set}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 224M

  anomaly:
