# Local development override (auto-merged by `docker compose`).
# Publishes Postgres on loopback so the company-segment service and its
# tests can reach the ledger DB from the host. Loopback-only — never a
# public bind. Safe under the same rule as backend's 127.0.0.1:8000.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  mongo:
    ports:
      - "127.0.0.1:27017:27017"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
