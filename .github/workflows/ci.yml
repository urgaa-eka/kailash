name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the deploy workflows call this workflow as a gate, so a deploy waits
  # for CI instead of running as an independent, separately-triggered workflow.
  workflow_call:

defaults:
  run:
    working-directory: Kailash

jobs:
  # Must exist before any check below is wired as a gate: a check whose own
  # tests fail is not something to trust with a deployment decision.
  verify-scripts:
    name: Verify scripts (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/verify -m "not docker and not network"

  config-drift:
    name: Config drift
    runs-on: ubuntu-latest
    needs: verify-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.config_drift

  repo-state:
    name: Repository state
    runs-on: ubuntu-latest
    needs: verify-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.repo_state

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: verify-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.secret_scan

  # RULES.md Rule 1: only RULES.md + Kailash/ + .github/ + .gitignore at the
  # repository root — nothing loose outside the master folder.
  root-singletons:
    name: Root singletons (Rule 1)
    runs-on: ubuntu-latest
    needs: verify-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.root_singletons

  # RULES.md Rule 3: exactly one BRD, one TRD, one PRD, and no duplicate copies.
  doc-singletons:
    name: Doc singletons (Rule 3)
    runs-on: ubuntu-latest
    needs: verify-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.doc_singletons

  # RULES.md Rule 5, membership clause: `.github/workflows/` holds exactly the
  # one gated pipeline (ci.yml + the two deploy entrypoints) and no auxiliary or
  # one-off workflow file. workflow-gate below checks the pipeline's topology;
  # this checks its file set, the way doc-singletons checks Rule 3's.
  workflow-singletons:
    name: Workflow singletons (Rule 5)
    runs-on: ubuntu-latest
    needs: verify-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.workflow_singletons

  # --require-staging (spec task 12.9): task 12.6 added deploy-staging and
  # verify-staging to both deploy workflows, so production deploy jobs must
  # now have both as transitive `needs`, staging and production hostname and
  # secret-name sets must be disjoint, and the compose service sets must be
  # identical. No step here masks a non-zero exit; a gate that cannot fail
  # is not a gate.
  workflow-gate:
    name: Workflow gate topology
    runs-on: ubuntu-latest
    needs: verify-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - run: python -m scripts.verify.workflow_gate --require-staging

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff==0.5.0
      - run: ruff check backend

  shared:
    name: Shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi pydantic pydantic-settings
      - run: PYTHONPATH=. pytest -q tests/platform

  services:
    name: Service · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        service:
          - document-ai
          - forecasting
          - anomaly
          - rag
          - vision-gateway
          - speech
          - model-registry
          - knowledge-graph
          - automobile-llm
    defaults:
      run:
        working-directory: Kailash/backend/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx python-multipart
      - name: Test
        run: PYTHONPATH=../../.. pytest -q

  company-service:
    name: Service · company (Postgres ledger)
    runs-on: ubuntu-latest
    needs: shared
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kailash
          POSTGRES_USER: kailash
          POSTGRES_PASSWORD: kailash_ci  # secret-scan: allow throwaway credential for the CI Postgres service container
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kailash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Kailash/backend/services/company
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Test (e2e + adversarial invariants)
        env:
          COMPANY_DB_URL: postgresql://kailash:kailash_ci@localhost:5432/kailash
        run: PYTHONPATH=../../.. pytest -q

  company-infra:
    name: Infra · company (CDK synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kailash/infra/company
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build Lambda bundle
        run: bash scripts/build-lambda.sh
      - name: Install CDK deps
        run: npm install --no-audit --no-fund
      - name: Synthesize KailashCompanyStack
        run: npx cdk synth --quiet

  backend:
    name: Kailash backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kailash/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Kailash/backend/requirements.txt
      # emergentintegrations is not on public PyPI, so a plain
      # `pip install -r requirements.txt` fails here and this job never reaches
      # its test step. Same carve-out the image build uses (see Dockerfile).
      - run: |
          python -m pip install --upgrade pip
          grep -vi '^emergentintegrations' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          # verify: allow a failed optional install surfaces at the next step,
          # which runs `import backend.main` and cannot succeed without it
          pip install emergentintegrations==0.1.0 \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ || true
      # Runs backend/tests, not ../tests/backend. The latter is three probe
      # scripts pointed at a decommissioned Emergent preview host; pytest
      # collects exactly one of them and it passes without asserting anything.
      # No `|| true`: both steps are allowed to fail the job.
      #
      # Both steps run from Kailash/ (backend's PARENT), not Kailash/backend:
      # the app now uses absolute `backend.…` imports, and importing from
      # backend/ would put a top-level `platform` package on sys.path and shadow
      # the stdlib `platform` module. Same reason as the Dockerfile WORKDIR.
      - name: Import the app
        run: cd .. && python -c "import backend.main"
      - name: Backend tests
        run: |
          pip install pytest pytest-asyncio
          cd .. && python -m pytest backend/tests -q

  frontend:
    name: Kailash frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kailash/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 20, matching deploy-frontend.yml and frontend/Dockerfile. On 18 the
          # install fails outright: react-router-dom@7.9.6 in yarn.lock declares
          # `engines.node >=20`, so CI was testing a Node the shipped artifact
          # is never built on.
          node-version: "20"
          cache: yarn
          cache-dependency-path: Kailash/frontend/yarn.lock
      # No `|| yarn install` fallback: the lockfile determines what production
      # installs, so drift must fail here rather than be silently resolved into
      # a different dependency set than the one deploy-frontend.yml pins.
      - run: yarn install --frozen-lockfile
      # Built with the same env as deploy-frontend.yml, including `CI: false`.
      # The two must match or CI would be gating a different artifact than the
      # one that ships. `CI: false` is what stops CRA promoting warnings to
      # errors; tightening that belongs with the lint work, not here, and
      # re-adding `|| true` would just restore the masking this removes.
      - name: Build (same configuration deploy-frontend.yml ships)
        run: yarn build
        env:
          REACT_APP_BACKEND_URL: ${{ vars.BACKEND_URL || 'https://api.kailash-ai.in' }}
          REACT_APP_ENV: production
          REACT_APP_DOMAIN: kailash-ai.in
          REACT_APP_APP_NAME: Kailash
          GENERATE_SOURCEMAP: 'false'
          CI: false

  compose-build:
    name: Compose build (sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Audit build definitions
        # Static COPY/ADD resolution across all nine SERVICE values. Fails in
        # seconds on a path error that would otherwise surface minutes into a
        # layer build.
        run: python -m scripts.verify.build_audit
      - name: Build images
        # docker-compose.yml uses `${VAR:?...}` for its credentials, which every
        # compose subcommand honours -- `build` and `config` included. These are
        # throwaway values that only satisfy interpolation; nothing is started
        # here, so they never reach a running container.
        #
        # --profile kailash-ai: without it the profile-gated services are inert
        # and this job built 3 images while claiming to sanity-check the build.
        # The full profile builds all 15 -- one more than production runs
        # (docs/records/profiled-services-scope.md excludes `frontend` from the
        # VPS), because CI's question is "does every tracked build file build",
        # not "what does production run".
        env:
          POSTGRES_PASSWORD: ci-build-placeholder
          REDIS_PASSWORD: ci-build-placeholder
          PLATFORM_INTERNAL_TOKEN: ci-build-placeholder
        run: docker compose -f docker-compose.yml --profile kailash-ai build --pull
