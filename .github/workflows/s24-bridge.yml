name: S24 Bridge (real-asus)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s24-bridge:
    runs-on: [self-hosted, Windows, real-asus, jayti-asus]
    timeout-minutes: 15
    steps:
      - name: Environment snapshot
        shell: powershell
        run: |
          Write-Host "=== HOST ==="
          hostname
          Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer, Model | Format-List
          Write-Host "=== IPs ==="
          Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object InterfaceAlias, IPAddress | Format-Table

      - name: ARP snapshot
        shell: powershell
        run: arp -a

      - name: Scan LAN for S24 (5555 adb / 8022 ssh)
        shell: powershell
        run: |
          $conn = Get-NetIPConfiguration | Where-Object { $_.IPv4DefaultGateway } | Select-Object -First 1
          if (-not $conn) { $conn = Get-NetIPConfiguration | Select-Object -First 1 }
          $ip = $conn.IPv4Address.IPAddress
          if (-not $ip) { $ip = '192.168.1.1' }
          $prefix = $ip.Substring(0, $ip.LastIndexOf('.') + 1)
          Write-Host "Using interface $($conn.InterfaceAlias) / scanning $prefix 0-254 for 5555/8022..."
          $found = @()
          foreach ($i in 1..254) {
            foreach ($p in @(5555, 8022)) {
              $tcp = New-Object Net.Sockets.TcpClient
              try {
                $async = $tcp.BeginConnect("$prefix$i", $p, $null, $null)
                if ($async.AsyncWaitHandle.WaitOne(250)) {
                  if ($tcp.Connected) { $found += "$prefix$i" }
                }
              } catch {} finally { $tcp.Close() }
            }
          }
          $found = $found | Select-Object -Unique
          if ($found.Count -gt 0) {
            $found | ForEach-Object { Write-Host "S24-style host: $_" }
            Set-Content -Path "$env:GITHUB_WORKSPACE\found_hosts.txt" -Value ($found -join ',')
          } else {
            Write-Host "No S24-style ports found on LAN."
            Set-Content -Path "$env:GITHUB_WORKSPACE\found_hosts.txt" -Value ""
          }

      - name: Try adb connect to found hosts
        shell: powershell
        run: |
          $foundHosts = (Get-Content "$env:GITHUB_WORKSPACE\found_hosts.txt" -ErrorAction SilentlyContinue).Trim()
          $adb = Get-Command adb -ErrorAction SilentlyContinue
          if (-not $adb) { Write-Host "adb not installed on ASUS"; exit 0 }
          & adb devices
          if ($foundHosts) {
            foreach ($h in $foundHosts.Split(',')) { & adb connect "$h`:5555" }
          }
          & adb devices

      - name: Report
        shell: powershell
        run: Write-Host "Bridge job completed on real-asus host"