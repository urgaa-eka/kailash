name: Deploy Frontend → Firebase

on:
  push:
    branches: [main]
    paths:
      - 'Kailash/frontend/**'
  workflow_dispatch:
    inputs:
      # Read by build-and-deploy's `if:` below. It was declared here and then
      # referenced nowhere, so selecting "staging" still promoted to
      # channelId: live -- a selector that lied about what it did.
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

defaults:
  run:
    working-directory: Kailash

jobs:
  # Repository-state checks that must hold before anything is built. These are
  # cheap and fail fast, so they run alongside the gate rather than after it.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.config_drift
      - run: python -m scripts.verify.secret_scan
      - run: python -m scripts.verify.repo_state

  # Runs the full CI workflow as a gate. Without this edge, ci.yml and this
  # workflow were independent triggers on the same push, so a deploy could
  # reach Firebase while CI was still running -- or after it had failed.
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # Deploys the same commit to the named Firebase `staging` channel first
  # (spec tasks 12.2/12.6, Requirements 8.1, 8.4). A named channel keeps the
  # stable hostname https://kailash-29111--staging.web.app; only unnamed
  # channels get hash suffixes. `expires: 30d` is refreshed by every staging
  # deploy, so an abandoned staging URL lapses instead of silently serving an
  # ancient build (expiry decision recorded in docs/runbooks/staging.md).
  deploy-staging:
    name: Deploy staging channel
    runs-on: ubuntu-latest
    needs: [preflight, ci-gate]
    # Same branch guard deploy-backend.yml carries on its own deploy-staging:
    # workflow_dispatch accepts any ref, and without this a branch nobody
    # reviewed reaches a Firebase channel on the live project. References no
    # status function, so the implicit success() on `needs` above still
    # applies and the CI gate stays a gate.
    if: github.ref == 'refs/heads/main'
    environment: staging
    # Workload Identity Federation needs id-token: write to mint the OIDC
    # token GitHub presents to Google. Declaring any permissions block flips
    # GITHUB_TOKEN to deny-by-default, so contents: read must be listed too or
    # actions/checkout breaks -- and that surfaces as a confusing checkout
    # failure rather than an auth error.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: Kailash/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Record staged commit
        run: echo "Deploying \`${{ github.sha }}\` to Firebase Hosting channel \`staging\`." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: Kailash/frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      # Same build configuration as production apart from the environment
      # identity: the staging bundle calls the staging API, or the staging
      # check would be exercising production's backend (Requirement 8.6).
      - name: Build for staging
        run: yarn build
        env:
          REACT_APP_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL || 'https://staging-api.kailash-ai.in' }}
          REACT_APP_ENV: staging
          REACT_APP_DOMAIN: staging.kailash-ai.com
          REACT_APP_APP_NAME: Kailash
          GENERATE_SOURCEMAP: 'false'
          CI: false

      # verify-staging compares the served HTML against *this* build's
      # manifest, same reasoning as the production artifact below.
      - name: Upload staging asset manifest
        uses: actions/upload-artifact@v4
        with:
          name: asset-manifest-staging
          path: Kailash/frontend/build/asset-manifest.json
          if-no-files-found: error

      # Org policy forbids both key creation and key upload
      # (iam.disableServiceAccountKeyCreation + ...KeyUpload, enforced at org
      # 74131276991), so no service-account key can exist. GitHub presents its
      # own OIDC token instead and impersonates github-actions-deploy@, which
      # holds roles/firebasehosting.admin. Nothing to leak, nothing to rotate.
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/794735482892/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@kailash-29111.iam.gserviceaccount.com

      # action-hosting-deploy@v0 cannot consume WIF credentials: its only auth
      # input is firebaseServiceAccount, which expects key JSON, and it does
      # not read Application Default Credentials (upstream issue #174, open
      # since 2021). The firebase CLI does honour GOOGLE_APPLICATION_CREDENTIALS
      # as auth@v2 sets it. Trade-off: the action's automatic PR comment is
      # lost along with it.
      #
      # hosting:staging is the DEDICATED SITE kailash-staging (targets in
      # frontend/.firebaserc), not a preview channel: channels cannot carry
      # custom domains, so staging.kailash-ai.com can only be served by its
      # own site. Deploying the main site here would put staging content on
      # production's domain.
      - name: Deploy to the staging site
        run: npx --yes firebase-tools@13 deploy --only hosting:staging --project kailash-29111 --non-interactive

  # Confirms staging actually serves what was just deployed, BEFORE anything
  # touches production. Its exit code is the job's exit code; a failure here
  # makes GitHub Actions skip every job that `needs` it, which is how
  # Requirements 8.7/8.8 hold through the dependency graph rather than
  # through in-job conditionals.
  verify-staging:
    name: Verify staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with:
          name: asset-manifest-staging
          path: artifact
      - run: python -m scripts.verify.deployment_check --env staging --manifest artifact/asset-manifest.json

  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    # Production is reachable only through green staging verification (spec
    # task 12.6, Requirement 8.8). deploy-staging is named alongside
    # verify-staging so a skipped verification cannot be mistaken for a green
    # one, and workflow_gate.py --require-staging asserts both edges.
    needs: [preflight, ci-gate, deploy-staging, verify-staging]
    # Two guards, deliberately free of status functions. always(), failure(),
    # cancelled(), or a `success() || ...` disjunction here would override the
    # implicit success() that the `needs` edge above relies on, so production
    # could run past a red verify-staging -- the one outcome the promotion gate
    # exists to prevent.
    #
    # 1. github.ref: the guard deploy-backend.yml's `deploy` job carries.
    #    workflow_dispatch can be fired from any ref, so without it a dispatch
    #    from an unreviewed branch deployed that ref to channelId: live.
    # 2. inputs.environment: the dispatch input is now actually read, so a
    #    "staging" dispatch stops after verify-staging instead of promoting.
    #    `inputs` is absent on the push trigger, hence the event_name arm.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.environment == 'production')
    # The production GitHub Environment, and whatever reviewer requirement is
    # configured on it, apply to the frontend live deploy the same way
    # `environment: staging` above scopes the channel deploy and
    # deploy-backend.yml's `deploy` scopes the VPS (Requirement 9.5).
    environment: production
    # Same WIF requirement as deploy-staging above: id-token: write to mint the
    # OIDC token, contents: read because declaring permissions at all makes
    # GITHUB_TOKEN deny-by-default and checkout would otherwise fail.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: Kailash/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Record deployed commit
        run: echo "Deploying \`${{ github.sha }}\` to Firebase Hosting (live)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: Kailash/frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Build for production
        run: yarn build
        env:
          REACT_APP_BACKEND_URL: ${{ vars.BACKEND_URL || 'https://api.kailash-ai.in' }}
          REACT_APP_ENV: production
          REACT_APP_DOMAIN: kailash-ai.in
          REACT_APP_APP_NAME: Kailash
          GENERATE_SOURCEMAP: 'false'
          CI: false

      # The manifest verify-production compares the served HTML against has to
      # come from *this* build. Reading it from the deployed site instead would
      # compare a build to itself and pass unconditionally.
      - name: Upload asset manifest
        uses: actions/upload-artifact@v4
        with:
          name: asset-manifest
          path: Kailash/frontend/build/asset-manifest.json
          if-no-files-found: error

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/794735482892/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@kailash-29111.iam.gserviceaccount.com

      # kailash-29111 is the project kailash-ai.com actually resolves to.
      # kailash-38268 served a stale "AEGIS HUB" build on no live domain.
      # hosting:production scopes to the main site's target: a bare
      # `--only hosting` would deploy every target in firebase.json,
      # staging site included, from the production job.
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13 deploy --only hosting:production --project kailash-29111 --non-interactive

  # Confirms production actually serves what was just deployed. Its exit code
  # is the job's exit code -- that is what "record the outcome in the workflow
  # run" means in Actions terms.
  #
  # Exit 2 (UNAVAILABLE) is reported distinctly from exit 1 (FAILED): a runner
  # that lost egress is not the same event as production being wrong.
  verify-production:
    name: Verify production
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with:
          name: asset-manifest
          path: artifact
      - run: python -m scripts.verify.deployment_check --env production --manifest artifact/asset-manifest.json
