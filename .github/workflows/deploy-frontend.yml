name: Deploy Frontend → Firebase

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # Repository-state checks that must hold before anything is built. These are
  # cheap and fail fast, so they run alongside the gate rather than after it.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.config_drift
      - run: python -m scripts.verify.secret_scan
      - run: python -m scripts.verify.repo_state

  # Runs the full CI workflow as a gate. Without this edge, ci.yml and this
  # workflow were independent triggers on the same push, so a deploy could
  # reach Firebase while CI was still running -- or after it had failed.
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    needs: [preflight, ci-gate]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Record deployed commit
        run: echo "Deploying \`${{ github.sha }}\` to Firebase Hosting (live)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Build for production
        run: yarn build
        env:
          REACT_APP_BACKEND_URL: ${{ vars.BACKEND_URL || 'https://api.kailash-ai.in' }}
          REACT_APP_ENV: production
          REACT_APP_DOMAIN: kailash-ai.in
          REACT_APP_APP_NAME: Kailash
          GENERATE_SOURCEMAP: 'false'
          CI: false

      # The manifest verify-production compares the served HTML against has to
      # come from *this* build. Reading it from the deployed site instead would
      # compare a build to itself and pass unconditionally.
      - name: Upload asset manifest
        uses: actions/upload-artifact@v4
        with:
          name: asset-manifest
          path: frontend/build/asset-manifest.json
          if-no-files-found: error

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          # kailash-29111 is the project kailash-ai.com actually resolves to.
          # kailash-38268 served a stale "AEGIS HUB" build on no live domain.
          projectId: kailash-29111
          entryPoint: frontend

  # Confirms production actually serves what was just deployed. Its exit code
  # is the job's exit code -- that is what "record the outcome in the workflow
  # run" means in Actions terms.
  #
  # Exit 2 (UNAVAILABLE) is reported distinctly from exit 1 (FAILED): a runner
  # that lost egress is not the same event as production being wrong.
  verify-production:
    name: Verify production
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with:
          name: asset-manifest
          path: artifact
      - run: python -m scripts.verify.deployment_check --env production --manifest artifact/asset-manifest.json
