name: Rollback Firebase Hosting (re-release a prior version)

# Manual, reversible rollback of a Firebase Hosting site to a previously
# deployed version, without deleting anything. It finds the version whose
# build contains a given hashed entry bundle (main.<hash>.js) and creates a
# NEW release pointing at that version -- the documented Firebase rollback.
#
# This does not build or change any code; it only re-points the live release.
# To go forward again, dispatch deploy-frontend.yml (or run this with the
# newer hash). Auth reuses the same keyless WIF service account as the deploy
# workflows (github-actions-deploy@, roles/firebasehosting.admin).

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Firebase Hosting site ID to roll back'
        required: true
        default: 'kailash-ai'
        type: string
      target_js_hash:
        description: 'CRA entry bundle hash to restore (the <hash> in main.<hash>.js)'
        required: true
        default: '784ed41e'
        type: string
      apply:
        description: 'Actually create the release (false = dry run: find and report only)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    name: Re-release prior version
    runs-on: ubuntu-latest
    steps:
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/794735482892/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@kailash-29111.iam.gserviceaccount.com

      - name: Find the target version and roll back to it
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SITE: ${{ inputs.site }}
          TARGET_HASH: ${{ inputs.target_js_hash }}
          APPLY: ${{ inputs.apply }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.parse, urllib.error

          TOKEN = os.environ["ACCESS_TOKEN"]
          SITE = os.environ["SITE"]
          HASH = os.environ["TARGET_HASH"].strip()
          APPLY = os.environ["APPLY"].strip().lower() == "true"
          BASE = "https://firebasehosting.googleapis.com/v1beta1"
          TARGET_FILE = f"/static/js/main.{HASH}.js"

          def api(method, path, query=None):
              url = f"{BASE}/{path}"
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              req = urllib.request.Request(url, method=method)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read().decode()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code} on {method} {url}: {e.read().decode()[:500]}")
                  raise

          # 1) Walk the release history (most-recent first), collecting unique versions.
          versions, seen, tok = [], set(), None
          while True:
              q = {"pageSize": 100}
              if tok: q["pageToken"] = tok
              data = api("GET", f"sites/{SITE}/releases", q)
              for rel in data.get("releases", []):
                  v = rel.get("version", {})
                  name = v.get("name")
                  if name and name not in seen:
                      seen.add(name)
                      versions.append((name, rel.get("releaseTime", "?"), v.get("status", "?")))
              tok = data.get("nextPageToken")
              if not tok:
                  break

          print(f"Site '{SITE}': {len(versions)} distinct released versions in history.")
          target = None
          # 2) For each version, inspect its files for the target entry bundle.
          for name, rtime, status in versions:
              vid = name.split("/")[-1]
              files, ftok = [], None
              while True:
                  q = {"pageSize": 1000}
                  if ftok: q["pageToken"] = ftok
                  fdata = api("GET", f"sites/{SITE}/versions/{vid}/files", q)
                  files.extend(f.get("path", "") for f in fdata.get("files", []))
                  ftok = fdata.get("nextPageToken")
                  if not ftok:
                      break
              entry = sorted(p for p in files if p.startswith("/static/js/main.") and p.endswith(".js"))
              print(f"  version {vid}  released={rtime}  status={status}  entry_js={entry}")
              if TARGET_FILE in files and target is None:
                  target = name
                  print(f"  -> MATCH: {name} contains {TARGET_FILE}")

          if not target:
              print(f"\nNo released version of '{SITE}' contains {TARGET_FILE}.")
              print("Nothing changed. Pick a hash from the entry_js lists above and re-run.")
              sys.exit(1)

          if not APPLY:
              print(f"\nDRY RUN: would roll '{SITE}' back to {target} (apply=false). Nothing changed.")
              sys.exit(0)

          # 3) Create a new release pointing at the target version = rollback.
          rel = api("POST", f"sites/{SITE}/releases", {"versionName": target})
          print(f"\nROLLED BACK '{SITE}' to {target}")
          print(f"new release: {rel.get('name')}  time: {rel.get('releaseTime')}")
          PY
