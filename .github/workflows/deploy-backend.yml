name: Deploy Backend → Vultr

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'deploy/vultr/**'
  workflow_dispatch:

jobs:
  # Runs the full CI workflow as a gate. Without this edge, ci.yml and this
  # workflow were independent triggers on the same push, so lint, the service
  # matrix, the company ledger suite and the compose build had no bearing on
  # whether a deploy reached the VPS.
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # emergentintegrations is not on public PyPI, so a plain
      # `pip install -r requirements.txt` fails and this job never reaches its
      # test step. Same carve-out the image build uses (see Dockerfile).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vi '^emergentintegrations' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          pip install emergentintegrations==0.1.0 \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ || true

      # No `|| true`: a failing test must skip the deploy job below.
      - name: Run tests
        run: |
          if [ -d ../tests/backend ]; then
            pip install pytest
            PYTHONPATH=.. pytest ../tests/backend -q
          fi

  deploy:
    name: Deploy to Vultr VPS
    runs-on: ubuntu-latest
    needs: [ci-gate, test]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Record deployed commit
        run: echo "Deploying \`${{ github.sha }}\` to the Vultr VPS." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Vultr via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          port: ${{ secrets.VULTR_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/kailash

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Rebuild and restart containers
            docker compose -f docker-compose.yml up -d --build --remove-orphans

            # Wait and health check
            sleep 15
            curl -sf http://127.0.0.1:8000/api/health || {
              echo "Health check failed!"
              docker compose -f docker-compose.yml logs --tail=50 backend
              exit 1
            }

            echo "✅ Deployment successful!"
            docker compose -f docker-compose.yml ps
