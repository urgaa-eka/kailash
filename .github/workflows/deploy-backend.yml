name: Deploy Backend → managed host

on:
  push:
    branches: [main]
    paths:
      - 'Kailash/backend/**'
      - 'Kailash/docker-compose.yml'
      - 'Kailash/deploy/host/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: Kailash

jobs:
  # Repository-state checks that must hold before anything is deployed.
  # repo_state matters most here: deploy.sh runs `git reset --hard` and
  # `git clean -fd` on the VPS, so an uncommitted change on a critical path is
  # deleted with nothing to recover from.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.config_drift
      - run: python -m scripts.verify.secret_scan
      - run: python -m scripts.verify.repo_state

  # Runs the full CI workflow as a gate. Without this edge, ci.yml and this
  # workflow were independent triggers on the same push, so lint, the service
  # matrix, the company ledger suite and the compose build had no bearing on
  # whether a deploy reached the VPS.
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kailash/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Kailash/backend/requirements.txt

      # emergentintegrations is not on public PyPI, so a plain
      # `pip install -r requirements.txt` fails and this job never reaches its
      # test step. Same carve-out the image build uses (see Dockerfile).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vi '^emergentintegrations' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          # verify: allow a failed optional install surfaces at the next step,
          # which runs `import backend.main` and cannot succeed without it
          pip install emergentintegrations==0.1.0 \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ || true

      # Runs backend/tests, not ../tests/backend -- see the note in ci.yml.
      # No `|| true`: a failing step must skip the deploy job below.
      # Run from Kailash/ (backend's parent) so absolute `backend.…` imports
      # resolve without backend/platform/ shadowing the stdlib platform module.
      - name: Import the app
        run: cd .. && python -c "import backend.main"
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio
          cd .. && python -m pytest backend/tests -q

  # Brings up the kailash-staging compose project on the VPS first (spec
  # tasks 12.3/12.6, Requirements 8.2, 8.4). Same compose file, same profile,
  # same 14 services as production; the overlay changes only container names,
  # ports (+1000 on 127.0.0.1) and resource ceilings, and re-pins every
  # credential site to the STAGING_* names.
  deploy-staging:
    name: Deploy staging stack
    runs-on: ubuntu-latest
    needs: [preflight, ci-gate, test]
    if: github.ref == 'refs/heads/main'
    environment: staging
    # Requirement 8.3: the staging credential set, declared under names
    # disjoint from production's (POSTGRES_PASSWORD -> STAGING_POSTGRES_PASSWORD
    # and so on). This env block is the declaration Requirement 8.3 says the
    # verification reads, and workflow_gate.py asserts the disjointness.
    env:
      STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      STAGING_REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
      STAGING_PLATFORM_INTERNAL_TOKEN: ${{ secrets.STAGING_PLATFORM_INTERNAL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Record staged commit
        run: echo "Deploying \`${{ github.sha }}\` to the kailash-staging compose project." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_BACKEND_SSH_HOST }}
          username: ${{ secrets.STAGING_BACKEND_SSH_USER }}
          key: ${{ secrets.STAGING_BACKEND_SSH_KEY }}
          port: ${{ secrets.STAGING_BACKEND_SSH_PORT || 22 }}
          script_stop: true
          envs: STAGING_POSTGRES_PASSWORD,STAGING_REDIS_PASSWORD,STAGING_PLATFORM_INTERNAL_TOKEN
          script: |
            cd /opt/kailash

            # Same checkout production deploys from; both jobs in this run
            # reset to the same origin/main commit, staging first.
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cd /opt/kailash/Kailash  # project master folder: compose + deploy files live here

            # The staging service set is production's, by requirement (8.2):
            # the kailash-ai profile's 15 services minus `frontend`, decided
            # in docs/records/profiled-services-scope.md. Keep in step with
            # PROD_SERVICES below and in deploy/host/deploy.sh.
            STAGING_SERVICES="backend mongo postgres redis company document-ai forecasting anomaly rag vision-gateway speech model-registry knowledge-graph automobile-llm"

            GIT_COMMIT="$(git rev-parse HEAD)"
            export GIT_COMMIT

            # docker-compose.yml's own ${VAR:?} sites interpolate at parse
            # time, so the unprefixed names must exist too; the overlay
            # re-pins every credential site to the STAGING_* names, so these
            # exports are what the staging containers actually receive.
            export POSTGRES_PASSWORD="$STAGING_POSTGRES_PASSWORD"
            export REDIS_PASSWORD="$STAGING_REDIS_PASSWORD"
            export PLATFORM_INTERNAL_TOKEN="$STAGING_PLATFORM_INTERNAL_TOKEN"

            # -p kailash-staging namespaces containers, volumes and networks;
            # fresh kailash-staging_* volumes exercise the initdb first-boot
            # path (see the overlay header). $STAGING_SERVICES deliberately
            # unquoted: compose takes the names as separate arguments.
            docker compose -p kailash-staging \
              -f docker-compose.yml -f deploy/staging/docker-compose.staging.yml \
              --profile kailash-ai up -d --build --remove-orphans $STAGING_SERVICES

            # Wait and health check on the offset staging port.
            sleep 15
            curl -sf http://127.0.0.1:9000/api/health || {
              echo "Staging health check failed!"
              docker compose -p kailash-staging \
                -f docker-compose.yml -f deploy/staging/docker-compose.staging.yml \
                logs --tail=50 backend
              exit 1
            }

            echo "✅ Staging deployment successful!"
            docker compose -p kailash-staging \
              -f docker-compose.yml -f deploy/staging/docker-compose.staging.yml \
              --profile kailash-ai ps

  # Confirms staging serves what was just deployed, BEFORE the production
  # deploy becomes reachable. A failure here makes Actions skip every job
  # that `needs` it — Requirements 8.7/8.8 held by the dependency graph
  # rather than by in-job conditionals.
  verify-staging:
    name: Verify staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.deployment_check --env staging

  deploy:
    name: Deploy to the managed host
    runs-on: ubuntu-latest
    # Production is reachable only through green staging verification (spec
    # task 12.6, Requirement 8.8); workflow_gate.py --require-staging asserts
    # these edges by reachability.
    needs: [preflight, ci-gate, test, deploy-staging, verify-staging]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Record deployed commit
        run: |
          echo "Deploying \`${{ github.sha }}\` to the managed host." >> "$GITHUB_STEP_SUMMARY"
          echo "Backend image tagged \`kailash-backend:${{ github.sha }}\` on the host (task 10.4)." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to the host via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USER }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          port: ${{ secrets.BACKEND_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/kailash

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cd /opt/kailash/Kailash  # project master folder: compose + deploy files live here

            # The service set production runs, decided in
            # docs/records/profiled-services-scope.md: the kailash-ai profile's
            # full 15-service set, minus `frontend`. Eleven of the fifteen
            # declare profiles: ["kailash-ai"], so without the flag this step
            # started four containers and left every platform service inert.
            # `frontend` is excluded because Firebase Hosting serves the SPA;
            # naming services also keeps --build from building the CRA image on
            # the VPS. Keep in step with PROD_SERVICES in deploy/host/deploy.sh.
            PROD_SERVICES="backend mongo postgres redis company document-ai forecasting anomaly rag vision-gateway speech model-registry knowledge-graph automobile-llm"

            # The commit actually checked out, exported so compose substitutes
            # it into the backend environment (docker-compose.yml:
            # GIT_COMMIT=${GIT_COMMIT:-unknown}) and /api/health reports what
            # is running (Requirement 6.6). Keep in step with the same export
            # in deploy/host/deploy.sh.
            GIT_COMMIT="$(git rev-parse HEAD)"
            export GIT_COMMIT

            # Rebuild and restart containers. $PROD_SERVICES is deliberately
            # unquoted: compose takes the service names as separate arguments.
            # --env-file backend/.env: docker-compose.yml interpolates
            # ${POSTGRES_PASSWORD:?} etc. at parse time from the project-dir .env
            # or the shell, NOT from the backend service's env_file. This job
            # (unlike deploy-staging, which exports the STAGING_* values) has no
            # such env, so it reads the host's backend/.env -- the same file
            # deploy/host/deploy.sh uses. Without it, `up` aborts at parse time.
            docker compose --env-file backend/.env -f docker-compose.yml --profile kailash-ai up -d --build --remove-orphans $PROD_SERVICES

            # Task 10.4 / Requirement 6.4: tag the image the backend container
            # runs with the deployed commit, then verify the tag exists on the
            # host. Resolved from the container's .Image rather than a
            # compose-derived name, which depends on the project directory.
            docker tag "$(docker inspect kailash-backend --format '{{.Image}}')" "kailash-backend:${GIT_COMMIT}"
            docker image inspect "kailash-backend:${GIT_COMMIT}" > /dev/null
            echo "Tagged kailash-backend:${GIT_COMMIT}"

            # Prune commit tags beyond the retention depth: 3, a conservative
            # default until the task 4.5 disk-headroom record justifies more
            # (the design proposed 10). Only full 40-hex tags are candidates,
            # so :latest is left alone, as is the tag just written. Keep in
            # step with RETAINED_IMAGE_TAGS in deploy/host/deploy.sh.
            docker image ls kailash-backend --format '{{.Tag}}' \
              | grep -E '^[0-9a-f]{40}$' | grep -vx "$GIT_COMMIT" \
              | tail -n +3 \
              | while read -r tag; do
                  docker rmi "kailash-backend:${tag}" > /dev/null 2>&1 \
                    || echo "could not remove kailash-backend:${tag} (in use?)"
                done

            # Wait and health check
            sleep 15
            curl -sf http://127.0.0.1:8000/api/health || {
              echo "Health check failed!"
              docker compose --env-file backend/.env -f docker-compose.yml logs --tail=50 backend
              exit 1
            }

            echo "✅ Deployment successful!"
            # --profile is required here too: `ps` filters by active profile, so
            # without it this line reports 4 containers out of 14.
            docker compose --env-file backend/.env -f docker-compose.yml --profile kailash-ai ps

  # Confirms the VPS actually serves what was just deployed. Its exit code is
  # the job's exit code. UNAVAILABLE (2) is reported distinctly from FAILED
  # (1): a runner that lost egress is not the same event as the API being down.
  verify-production:
    name: Verify production
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m scripts.verify.deployment_check --env production